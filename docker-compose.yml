x-app: &app
  build: .
  volumes:
    - ./var/private/resumes:/app/var/private/resumes
  environment:
    RESUME_RENDER_ENABLED: ${RESUME_RENDER_ENABLED:-true}
    LIBREOFFICE_BINARY: /usr/bin/libreoffice
    RESUME_STORAGE_ROOT: /app/var/private/resumes
    DATABASE_URL: postgresql+psycopg://jobhunter:local@db:5432/jobhunter
    REDIS_URL: redis://redis:6379/0
    UI_COOKIE_SECURE: ${UI_COOKIE_SECURE:-false}
    UI_SESSION_SECRET: ${UI_SESSION_SECRET:-}
    API_TOKEN: ${API_TOKEN:?Configure API_TOKEN in .env}
    EMAIL_SEND_ENABLED: "false"
    MATCH_PREPARE_THRESHOLD: ${MATCH_PREPARE_THRESHOLD:-75}
    SHEETS_SYNC_ENABLED: ${SHEETS_SYNC_ENABLED:-false}
    GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
    DISCOVERY_MODE: ${DISCOVERY_MODE:-disabled}
    JOB_SEARCH_TIMEZONE: ${JOB_SEARCH_TIMEZONE:-America/Bahia}
    JOB_SEARCH_CRON: ${JOB_SEARCH_CRON:-0 8 * * *}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *app
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *app
    command: ["celery", "-A", "job_hunter.workers.celery_app:celery", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  beat:
    <<: *app
    command: ["celery", "-A", "job_hunter.workers.celery_app:celery", "beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO"]
volumes:
  pgdata:
