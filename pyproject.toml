[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-ai"
version = "0.1.0"
description = "Personal job discovery with human-approved applications"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4", "SQLAlchemy>=2.0,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "tzdata>=2025.1",
  "google-auth[requests]>=2.38,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
